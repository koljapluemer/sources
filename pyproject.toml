[project]
name = "sources"
version = "0.1.0"
description = "Track literature and web sources as plaintext json"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bibtexparser>=2.0.1",
    "flask>=3.1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
